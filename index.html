<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mfumu Online Shop</title>
    <meta name="description" content="Premium branded apparel, headwear, and commemorative merchandise with interactive product customization, shopping bag, and instant WhatsApp checkout." />
    <meta property="og:title" content="Mfumu Online Shop" />
    <meta property="og:description" content="Premium branded apparel, headwear, and commemorative merchandise with interactive product customization, shopping bag, and instant WhatsApp checkout." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/0zni6OK.jpeg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const PRODUCTS = [
        {
          id: '1',
          name: 'Mfumu Classic Hooded Sweatshirt',
          category: 'Apparel',
          price: 450,
          image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&q=80&w=800',
          colors: ['#0f172a', '#1e293b', '#e2e8f0'],
          sizes: ['S', 'M', 'L', 'XL', '2XL'],
          description: 'Heavyweight premium cotton fleece designed for ultimate comfort and durability.'
        },
        {
          id: '2',
          name: 'Signature Mfumu Snapback Cap',
          category: 'Headwear',
          price: 180,
          image: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&q=80&w=800',
          colors: ['#0f172a', '#059669', '#d97706'],
          sizes: ['One Size'],
          description: 'Structured 6-panel snapback featuring high-density embroidered Mfumu insignia.'
        },
        {
          id: '3',
          name: 'Commemorative Gold Crest Tee',
          category: 'Apparel',
          price: 250,
          image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800',
          colors: ['#0f172a', '#ffffff'],
          sizes: ['S', 'M', 'L', 'XL'],
          description: '100% organic comb-spun cotton with metallic foil gold logo detailing.'
        },
        {
          id: '4',
          name: 'Mfumu Heritage Duffel Bag',
          category: 'Merchandise',
          price: 520,
          image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&q=80&w=800',
          colors: ['#0f172a', '#78350f'],
          sizes: ['Standard'],
          description: 'Water-resistant coated canvas travel bag with genuine leather accents.'
        }
      ];

      function App() {
        const [cart, setCart] = useState([]);
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [customText, setCustomText] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [selectedSize, setSelectedSize] = useState('');

        const categories = ['All', 'Apparel', 'Headwear', 'Merchandise'];

        const filteredProducts = selectedCategory === 'All' 
          ? PRODUCTS 
          : PRODUCTS.filter(p => p.category === selectedCategory);

        const addToCart = (product) => {
          const itemKey = `${product.id}-${selectedSize || product.sizes[0]}-${customText}`;
          const existing = cart.find(item => item.key === itemKey);
          
          if (existing) {
            setCart(cart.map(item => item.key === itemKey ? { ...item, qty: item.qty + 1 } : item));
          } else {
            setCart([...cart, {
              key: itemKey,
              ...product,
              selectedSize: selectedSize || product.sizes[0],
              customText: customText.trim(),
              qty: 1
            }]);
          }
          setSelectedProduct(null);
          setCustomText('');
          setIsCartOpen(true);
        };

        const updateQty = (key, delta) => {
          setCart(cart.map(item => {
            if (item.key === key) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean));
        };

        const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

        const checkoutWhatsApp = () => {
          if (cart.length === 0) return;
          
          let message = `*NEW ORDER - Mfumu Shop*\n\n`;
          cart.forEach((item, index) => {
            message += `${index + 1}. *${item.name}*\n`;
            message += `   Size: ${item.selectedSize}\n`;
            if (item.customText) message += `   Customization: "${item.customText}"\n`;
            message += `   Qty: ${item.qty} x ZMW ${item.price} = ZMW ${item.price * item.qty}\n\n`;
          });
          message += `*Total Amount:* ZMW ${cartTotal.toFixed(2)}`;

          const phoneNumber = '260970000000'; // Replace with your WhatsApp number
          window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        };

        return (
          <div class="min-h-screen flex flex-col">
            <!-- Header -->
            <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800">
              <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <img src="https://i.imgur.com/0zni6OK.jpeg" alt="Mfumu Logo" class="w-10 h-10 rounded-full border border-slate-700 object-cover" />
                  <span class="font-display font-bold text-xl tracking-tight text-white">MFUMU SHOP</span>
                </div>
                
                <button 
                  onClick={() => setIsCartOpen(true)}
                  class="relative p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition flex items-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  {cart.length > 0 && (
                    <span class="bg-emerald-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                      {cart.reduce((a, b) => a + b.qty, 0)}
                    </span>
                  )}
                </button>
              </div>
            </header>

            <!-- Hero Banner -->
            <section class="bg-slate-900 text-white py-16 px-4 text-center border-b border-slate-800">
              <div class="max-w-3xl mx-auto space-y-4">
                <span class="inline-block px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold tracking-wider uppercase">
                  Official Store
                </span>
                <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight">
                  Premium Custom Apparel & Goods
                </h1>
                <p class="text-slate-400 text-lg">
                  Explore high-quality branded wear. Personalize your items and place instant orders via WhatsApp.
                </p>
              </div>
            </section>

            <!-- Catalog -->
            <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
              <!-- Filter Tabs -->
              <div class="flex gap-2 overflow-x-auto pb-4 mb-8">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    class={`px-5 py-2.5 rounded-xl font-medium text-sm transition ${
                      selectedCategory === cat
                        ? 'bg-emerald-600 text-white shadow-sm'
                        : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <!-- Product Grid -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {filteredProducts.map(product => (
                  <div key={product.id} class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col">
                    <img src={product.image} alt={product.name} class="w-full h-64 object-cover" />
                    <div class="p-5 flex flex-col flex-grow">
                      <span class="text-xs font-semibold text-emerald-600 tracking-wider uppercase mb-1">{product.category}</span>
                      <h3 class="font-display font-semibold text-slate-900 text-lg mb-2">{product.name}</h3>
                      <p class="text-slate-500 text-sm mb-4 line-clamp-2 flex-grow">{product.description}</p>
                      <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                        <span class="font-mono font-bold text-slate-900 text-lg">ZMW {product.price}</span>
                        <button
                          onClick={() => {
                            setSelectedProduct(product);
                            setSelectedSize(product.sizes[0]);
                          }}
                          class="px-4 py-2 bg-slate-900 hover:bg-emerald-600 text-white font-medium text-sm rounded-xl transition"
                        >
                          Customize
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </main>

            <!-- Product Customization Modal -->
            {selectedProduct && (
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative overflow-hidden">
                  <button 
                    onClick={() => setSelectedProduct(null)} 
                    class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                  >
                    ✕
                  </button>

                  <div class="flex gap-4 mb-4">
                    <img src={selectedProduct.image} alt={selectedProduct.name} class="w-20 h-20 rounded-xl object-cover" />
                    <div>
                      <h3 class="font-display font-bold text-slate-900 text-lg">{selectedProduct.name}</h3>
                      <p class="font-mono font-bold text-emerald-600">ZMW {selectedProduct.price}</p>
                    </div>
                  </div>

                  <div class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Select Size</label>
                      <div class="flex gap-2">
                        {selectedProduct.sizes.map(size => (
                          <button
                            key={size}
                            onClick={() => setSelectedSize(size)}
                            class={`px-4 py-2 text-sm rounded-lg font-medium border ${
                              selectedSize === size
                                ? 'border-emerald-600 bg-emerald-50 text-emerald-700'
                                : 'border-slate-200 text-slate-700 hover:border-slate-300'
                            }`}
                          >
                            {size}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Custom Print / Monogram (Optional)</label>
                      <input
                        type="text"
                        placeholder="e.g., KING MFUMU 01"
                        value={customText}
                        onChange={(e) => setCustomText(e.target.value)}
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <button
                      onClick={() => addToCart(selectedProduct)}
                      class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition mt-4"
                    >
                      Add to Shopping Bag
                    </button>
                  </div>
                </div>
              </div>
            )}

            <!-- Shopping Bag Sidebar -->
            {isCartOpen && (
              <div class="fixed inset-0 z-50 overflow-hidden">
                <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
                  <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                    <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                      <h2 class="font-display font-bold text-lg text-slate-900">Your Cart</h2>
                      <button onClick={() => setIsCartOpen(false)} class="text-slate-400 hover:text-slate-600">✕</button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6 space-y-4">
                      {cart.length === 0 ? (
                        <p class="text-slate-500 text-center py-12">Your shopping bag is empty.</p>
                      ) : (
                        cart.map(item => (
                          <div key={item.key} class="flex gap-4 border-b border-slate-100 pb-4">
                            <img src={item.image} alt={item.name} class="w-16 h-16 rounded-lg object-cover" />
                            <div class="flex-1">
                              <h4 class="font-semibold text-slate-900 text-sm">{item.name}</h4>
                              <p class="text-xs text-slate-500">Size: {item.selectedSize}</p>
                              {item.customText && <p class="text-xs text-emerald-600">Custom: "{item.customText}"</p>}
                              <div class="flex items-center justify-between mt-2">
                                <span class="font-mono text-sm font-bold">ZMW {item.price * item.qty}</span>
                                <div class="flex items-center border border-slate-200 rounded-lg">
                                  <button onClick={() => updateQty(item.key, -1)} class="px-2 py-0.5 text-slate-600">-</button>
                                  <span class="px-2 text-xs font-semibold">{item.qty}</span>
                                  <button onClick={() => updateQty(item.key, 1)} class="px-2 py-0.5 text-slate-600">+</button>
                                </div>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    {cart.length > 0 && (
                      <div class="p-6 border-t border-slate-100 space-y-4">
                        <div class="flex justify-between text-base font-bold text-slate-900">
                          <span>Total</span>
                          <span class="font-mono text-emerald-600">ZMW {cartTotal.toFixed(2)}</span>
                        </div>
                        <button
                          onClick={checkoutWhatsApp}
                          class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2"
                        >
                          Checkout on WhatsApp
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            <!-- Footer -->
            <footer class="bg-slate-900 text-slate-400 py-8 text-center text-xs border-t border-slate-800">
              <p>&copy; {new Date().getFullYear()} Mfumu Online Shop. All rights reserved.</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
